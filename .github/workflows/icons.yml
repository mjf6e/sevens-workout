name: Generate PNG icons

# Renders icon.svg and icon-full.svg into the PNG sizes phones and browsers need,
# then commits them to icons/. Runs when either SVG (or this file) changes.
on:
  push:
    paths:
      - "icon.svg"
      - "icon-full.svg"
      - ".github/workflows/icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Render PNGs
        run: |
          mkdir -p icons
          # iPhone and iPad home screen icon: full-bleed square, iOS rounds the corners
          rsvg-convert -w 180 -h 180 icon-full.svg -o icons/apple-touch-icon.png
          # Android and desktop install icons with rounded corners
          rsvg-convert -w 192 -h 192 icon.svg -o icons/icon-192.png
          rsvg-convert -w 512 -h 512 icon.svg -o icons/icon-512.png
          # Android adaptive (maskable) icon: full-bleed with the art inside the safe zone
          rsvg-convert -w 512 -h 512 icon-full.svg -o icons/icon-maskable-512.png
          # Browser tab icon
          rsvg-convert -w 32 -h 32 icon.svg -o icons/favicon-32.png

      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons
          git diff --cached --quiet || (git commit -m "Generate PNG icons" && git push)
